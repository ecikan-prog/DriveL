workflows:
  android-release:
    name: DriveLegal Android Release
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      node: 20
      android_signing:
        - drivelegal_release

    scripts:
      - name: Install dependencies
        script: |
          cd DriveLegal
          corepack pnpm install --frozen-lockfile

      - name: Generate Android native project
        script: |
          cd DriveLegal
          npx expo prebuild --platform android --clean --non-interactive

      - name: Verify Android project
        script: |
          if [ ! -f "DriveLegal/android/gradlew" ]; then
            echo "ERROR: DriveLegal/android/gradlew was not generated."
            exit 1
          fi
          echo "Android Gradle project generated successfully."

      - name: Configure production signing
        script: |
         # Codemagic provides the signed keystore automatically via CM_* variables
         if [ -z "$CM_KEYSTORE_PATH" ]; then
           echo "ERROR: CM_KEYSTORE_PATH is not configured. Ensure android_signing is properly set up."
           exit 1
         fi
         if [ -z "$CM_KEYSTORE_PASSWORD" ]; then
           echo "ERROR: CM_KEYSTORE_PASSWORD is not configured."
           exit 1
         fi
         if [ -z "$CM_KEY_ALIAS" ]; then
           echo "ERROR: CM_KEY_ALIAS is not configured."
           exit 1
         fi
         if [ -z "$CM_KEY_PASSWORD" ]; then
           echo "ERROR: CM_KEY_PASSWORD is not configured."
           exit 1
         fi
         echo "Android signing configuration verified successfully."

      - name: Build Android App Bundle
        script: |
          cd DriveLegal/android
          chmod +x gradlew

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.****** \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.******

    artifacts:
      - DriveLegal/android/app/build/outputs/bundle/release/*.aab
