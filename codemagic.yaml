workflows:
  android-release:
    name: DriveLegal Android Release
    max_build_duration: 120
    instance_type: mac_mini_m1

    environment:
      node: 20

    scripts:
      - name: Install dependencies
        script: |
          cd DriveLegal
          corepack pnpm install --frozen-lockfile

      - name: Generate Android native project
        script: |
          cd DriveLegal
          npx expo prebuild --platform android --clean --non-interactive

      - name: Verify Android project
        script: |
          if [ ! -f "DriveLegal/android/gradlew" ]; then
            echo "ERROR: DriveLegal/android/gradlew was not generated."
            exit 1
          fi
          echo "Android Gradle project generated successfully."

      - name: Configure production signing
        script: |
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "ERROR: KEYSTORE_FILE is not configured."
            exit 1
          fi

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD is not configured."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS is not configured."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD is not configured."
            exit 1
          fi

          mkdir -p DriveLegal/android/app
          echo "$KEYSTORE_FILE" | base64 --decode > DriveLegal/android/app/release.keystore

          test -s DriveLegal/android/app/release.keystore

      - name: Build Android App Bundle
        script: |
          cd DriveLegal/android
          chmod +x gradlew

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.****** \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.******

    artifacts:
      - DriveLegal/android/app/build/outputs/bundle/release/*.aab
