workflows:
  # Your existing iOS workflow stays here...

  # ADD THIS NEW ANDROID WORKFLOW:
  android-release:
    name: DriveLegal Android Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate Android Keystore in Cloud
        script: |
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore android/app/release.keystore \
            -alias drivelegal-key \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "DriveLegalPass2026!" \
            -keypass "DriveLegalPass2026!" \
            -dname "CN=DriveLegal, OU=Dev, O=DriveLegal, L=City, S=State, C=US"
      - name: Build Android App Bundle (.aab)
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release.keystore \
            -Pandroid.injected.signing.store.password=DriveLegalPass2026! \
            -Pandroid.injected.signing.key.alias=drivelegal-key \
            -Pandroid.injected.signing.key.password=DriveLegalPass2026!
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
